---

- name: Testing FRR info querying
  hosts: localhost
  gather_facts: no
  module_defaults:
    oxlorg.opnsense.frr_diagnostic:
      firewall: "{{ lookup('ansible.builtin.env', 'TEST_FIREWALL') }}"
      api_credential_file: "{{ lookup('ansible.builtin.env', 'TEST_API_KEY') }}"
      ssl_verify: false

  environment:
    HTTPS_PROXY: "{{ lookup('ansible.builtin.env', 'TEST_PROXY') | default('') }}"

  tasks:
    - name: Showing BGP neighbors
      oxlorg.opnsense.frr_diagnostic:
        target: 'bgpneighbors'
      register: opn1
      failed_when: >
        opn1.failed or
        'data' not in opn1

    - name: Showing config
      oxlorg.opnsense.frr_diagnostic:
        target: 'generalrunningconfig'
      register: opn2
      failed_when: >
        opn2.failed or
        'data' not in opn2

    # A grid search, which is what every route view is. The bare name this used
    # to request has no controller action and answered 404, so the assertion is
    # the grid's own envelope rather than any particular route.
    - name: Showing the BGP IPv4 route table
      oxlorg.opnsense.frr_diagnostic:
        target: 'bgproute4'
      register: opn3
      failed_when: >
        opn3.failed or
        'data' not in opn3 or
        'rows' not in opn3.data
